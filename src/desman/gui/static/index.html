<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DESMAN</title>
    <!-- Assets remain external under the page's CSP. -->
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <nav id="topbar"></nav>
    <aside id="sidebar"><h1>DESMAN<span>(P)</span></h1><div id="session-tools"></div><div id="sessions"></div><div id="sidebar-bottom"></div></aside>
    <main>
      <div id="session-title"></div>
      <div id="status" role="status"></div>
      <!-- Transcript events and transient progress have separate lifetimes. -->
      <div id="messages" aria-live="polite"></div>
      <div id="live"></div>
      <button id="stop" hidden></button>
      <form id="prompt"></form>
    </main>
    <aside id="tasks-panel"><h2 id="tasks-title"></h2><div id="tasks"></div></aside>
  </body>
</html>
