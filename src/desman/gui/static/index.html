<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DESMAN</title>
    <!-- Assets remain external under the page's CSP. -->
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>DESMAN<span>(P)</span></h1>
      <div id="status" role="status"></div>
      <!-- Transcript events and transient progress have separate lifetimes. -->
      <div id="messages" aria-live="polite"></div>
      <div id="live"></div>
      <button id="stop" hidden></button>
      <form id="prompt"></form>
    </main>
  </body>
</html>
