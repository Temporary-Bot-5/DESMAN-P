<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DESMAN</title>
    <!-- Assets remain external under the page's CSP. -->
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <nav id="topbar"></nav>
    <aside id="sidebar"><h1><img class="banner" src="/img/banner.png" alt="DESMAN(P)"></h1><div id="session-tools"></div><div id="sessions"></div><div id="sidebar-bottom"></div></aside>
    <main>
      <div id="session-title"></div>
      <details id="chat-module" open><summary id="chat-module-title"></summary><div id="chat-module-card"></div></details>
      <div id="status" role="status"></div>
      <!-- Transcript events and transient progress have separate lifetimes. -->
      <div id="transcript-shell">
        <div id="messages" aria-live="polite"></div>
        <button id="to-bottom" type="button" hidden>↓</button>
      </div>
      <form id="pending"></form>
      <div id="live"></div>
      <button id="stop" hidden></button>
      <form id="prompt"></form>
    </main>
    <aside id="tasks-panel"><nav id="panel-switch"></nav><div id="tasks"></div><div id="modules" hidden></div><footer id="panel-footer"></footer></aside>
    <div id="settings-window" hidden>
      <section id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-heading" tabindex="-1">
        <header><h1 id="settings-heading"></h1><button id="settings-close" type="button">×</button></header>
        <div id="settings-layout"><nav id="settings-nav"></nav><div id="settings-form"></div></div>
        <footer><span id="settings-wait"></span><div id="settings-result" role="status"></div></footer>
      </section>
    </div>
  </body>
</html>
