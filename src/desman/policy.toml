# Which tools each role may use (ROADMAP 3.2; see src/desman/core/policy.py).
#
# Set by people only and reviewed like code: agents cannot reach this file. The human's
# permissions in config.json (`desman config`) are the upper bound: a tool that needs the
# network, a shell, files outside the workspace or admin rights stays refused while its switch
# is off, whatever this file says. A tool not listed for a role is refused to that role.

[roles.executor]
# run_command also needs the human's shell_execution switch, and runs only in the sandbox
# (src/desman/core/sandbox.py); without a working sandbox it is never offered.
# web_search and web_fetch also need the human's network_access switch; web_search also a
# search engine (a Tavily key or a SearXNG server).
# suggest_model asks Hugging Face what a model is (network_access too) and only records a
# suggestion for the person: nothing is downloaded, the config is not changed.
# read_node reads the knowledge tree (ADR 0009): DESMAN's documentation, read only.
tools = [
    "read_file", "write_file", "list_files", "run_command", "web_search", "web_fetch",
    "suggest_model", "read_node",
]

# The planner and the reviewer use no tools yet.
[roles.planner]
tools = []

[roles.reviewer]
tools = []

# Jobs from desman-global (ADR 0004, decision 6): someone else's task, run on this machine with
# the models the person lent. Files in the job's own workspace, and run_command in the sandbox
# (still only with the human's shell_execution switch). No web, no suggest_model; nothing of the
# person's (chat, profile, sessions, the knowledge tree) is a tool at all.
[roles.network_executor]
tools = ["read_file", "write_file", "list_files", "run_command"]

[roles.network_reviewer]
tools = []

[roles.network_planner]
tools = []
