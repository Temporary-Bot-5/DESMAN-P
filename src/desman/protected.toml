# Protected files (ROADMAP 5.3; see src/desman/core/protected.py).
#
# What decides what agents may do and whether their work is good. A change to any of them, or
# to this list, blocks every run until the person approves it (`desman protected show --diff`,
# then `desman protected approve`). Changed by people through git, like policy.toml: a commit
# that changes a file here updates its hash too (tests/test_protected.py prints the new line).
# Hashes are SHA-256 of the file with LF line endings.

