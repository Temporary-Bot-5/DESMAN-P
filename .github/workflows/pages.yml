name: GitHub Pages
on:
  push:
    branches: [master]
    paths: ['site/**', 'install/install.bat']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Served by the site itself: a browser ignores `download` on another origin's link
      # and shows raw.githubusercontent.com's text/plain instead of saving the file.
      - run: cp install/install.bat site/install.bat
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
