name: CI

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: CTRL+Z regression test
        run: pytest -q -p no:randomly tests/test_db.py -k ctrl_z
        continue-on-error: true
      - name: Cluster demo, 40 runs
        shell: bash
        run: |
          fails=0
          for i in $(seq 1 40); do
            pytest -q -p no:randomly tests/test_cluster_demo.py > out.txt 2>&1 || { fails=$((fails+1)); echo "RUN $i FAILED"; grep -m3 "Error\|malformed" out.txt; }
          done
          echo "fails=$fails/40"
          test $fails -eq 0
